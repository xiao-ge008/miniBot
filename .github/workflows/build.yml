name: Build Windows & macOS Installers

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-latest
            artifact_name: miniBot-Windows-x64-Installer
            bundle_path: app/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS-Apple-Silicon
            os: macos-latest
            artifact_name: miniBot-macOS-arm64-Installer
            bundle_path: app/src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './app/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: ./app
        run: pnpm install --frozen-lockfile

      - name: Build Tauri desktop bundles
        working-directory: ./app
        run: pnpm tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error

      - name: Publish to GitHub Release (on main/master or tag)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: miniBot v0.1.0 (Windows & macOS)
          body: |
            ## miniBot v0.1.0 自动构建安装包
            - **Windows (x64)**: 下载 `miniBot_0.1.0_x64-setup.exe`
            - **macOS (Apple Silicon)**: 下载 `miniBot_0.1.0_aarch64.dmg`
            > 注：本安装包不包含本地 `llama` 引擎与 `.gguf` 模型文件；首次启动后可在「设置 -> 本地引擎与模型」中按需一键下载，或直接启用「模型 API」使用云端模型。
          files: ${{ matrix.bundle_path }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
