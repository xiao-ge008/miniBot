[package]
name = "minibot"
version = "0.1.2"
description = "miniBot 桌面 AI 小工具"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "minibot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "macros", "process", "time", "sync", "io-util"] }
futures-util = "0.3.34"
anyhow = "1.0.104"
log = "0.4.35"
dirs = "7.0.0"
base64 = "0.23.1"
nvml-wrapper = "0.13.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
arboard = { version = "3.7.0", features = ["image-data"] }
image = { version = "0.25.8", default-features = false, features = ["png", "webp", "jpeg"] }
xcap = "0.9.8"
rxing = "0.9.3"
qrcode = "0.14.1"
chrono = "0.4.45"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["tls12"] }
webpki-root-certs = "1.0.11"
axum = "0.8.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_ProcessStatus", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections", "Globalization", "Win32_System_WinRT", "Win32_System_JobObjects", "Win32_Security"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
